name: Build MyList

on:
  push:
    branches:
      - master
      - feature/schedule-view
    paths:
      - "MyList/**"
      - ".github/workflows/build-mylist.yml"
  pull_request:
    paths:
      - "MyList/**"
      - ".github/workflows/build-mylist.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MyList

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firestore rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Test Firestore security rules
        run: npx firebase emulators:exec --only firestore --project demo-mylist-rules "npm run test:rules"

      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyList-debug-apk
          path: MyList/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
